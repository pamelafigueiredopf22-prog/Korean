const DRAW = { jelly, crayons, wrap, cupcake, crystal, sand, wafers };

// ---------- ball ----------
function ball(t) {
  const { x, y } = ballNow, a = x / R;
  // reflection in the glossy table
  ctx.save(); ctx.beginPath(); ctx.rect(x - R - 10, 0, 2 * R + 20, 2 * R + 40); ctx.clip(); ctx.globalAlpha = .22; ctx.scale(1, -1); steel(x, y, a); ctx.restore();
  const fg = ctx.createLinearGradient(0, 0, 0, 170); fg.addColorStop(0, 'rgba(241,217,196,0)'); fg.addColorStop(1, 'rgba(241,217,196,1)'); ctx.fillStyle = fg; ctx.fillRect(x - R - 12, 0, 2 * R + 24, 2 * R + 60);
  const g = ctx.createRadialGradient(x, 0, 0, x, 0, R * 1.1); g.addColorStop(0, 'rgba(40,25,40,.45)'); g.addColorStop(1, 'rgba(40,25,40,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, -at(EV.lift, t) + 4, R * 1.05, 26, 0, 0, TAU); ctx.fill();
  steel(x, y, a);
}
function steel(x, y, a) {
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.clip();
  let g = ctx.createLinearGradient(0, y - R, 0, y + R);
  g.addColorStop(0, '#f2f5fa'); g.addColorStop(.3, '#b9c3d0'); g.addColorStop(.47, '#6f7c8c'); g.addColorStop(.52, '#2a313b'); g.addColorStop(.62, '#46505d'); g.addColorStop(.85, '#a7b1be'); g.addColorStop(1, '#dfe5ec');
  ctx.fillStyle = g; ctx.fillRect(x - R, y - R, 2 * R, 2 * R);
  // pink/teal studio reflections
  ctx.globalAlpha = .35; ctx.fillStyle = '#ffc2d8'; ctx.beginPath(); ctx.ellipse(x - R * .55, y - R * .1, R * .25, R * .5, .2, 0, TAU); ctx.fill(); ctx.fillStyle = '#b8f0e6'; ctx.beginPath(); ctx.ellipse(x + R * .6, y - R * .15, R * .2, R * .45, -.2, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  // engraved seam that shows the roll
  ctx.strokeStyle = 'rgba(30,35,45,.35)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * R, y + Math.sin(a) * R); ctx.lineTo(x - Math.cos(a) * R, y - Math.sin(a) * R); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * R + 4, y + Math.sin(a) * R + 4); ctx.lineTo(x - Math.cos(a) * R + 4, y - Math.sin(a) * R + 4); ctx.stroke();
  g = ctx.createRadialGradient(x - R * .2, y - R * .25, R * .5, x, y, R); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(10,15,25,.45)'); ctx.fillStyle = g; ctx.fillRect(x - R, y - R, 2 * R, 2 * R);
  ctx.filter = 'blur(10px)'; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.ellipse(x - R * .38, y - R * .55, R * .28, R * .12, -.5, 0, TAU); ctx.fill(); ctx.filter = 'none';
  ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.ellipse(x - R * .42, y - R * .58, R * .1, R * .04, -.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, R - 4, -.4, .9); ctx.stroke();
  ctx.restore();
}

// ---------- frame ----------
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  const cam = camX(t), bx = ballX(t);
  // tension zoom while the ball presses a hard object, snap + shake on the break
  let z = 1, sx = 0, sy = 0, fx = 540, fy = 1000;
  for (const o of EV.objects) {
    if (o.th && t > o.th - .2 && t < o.tb + .6) { const k = t < o.tb ? sm((t - o.th) / (o.tb - o.th)) : 1 - sm((t - o.tb) / .35); z = 1 + .09 * k; fx = (o.x0 - cam) * EV.S; fy = GY - o.h * .55 * EV.S; }
    if (o.tb && t > o.tb && t < o.tb + .5 && (o.th || o.type === 'jelly' || o.type === 'cupcake')) { const u = t - o.tb, a = (o.th ? 14 : 7) * Math.exp(-11 * u); sx += a * Math.sin(u * 95); sy += a * Math.cos(u * 77); }
  }
  // wall + parallax bokeh
  let g = ctx.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, '#f3e6f7'); g.addColorStop(1, '#ffe9df'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r = rng(1); for (let i = 0; i < 14; i++) { const x = ((r() * 3000 - cam * .25) % 1500 + 1500) % 1500 - 200, y = 150 + r() * 900, rr = 40 + r() * 110; ctx.fillStyle = `rgba(255,255,255,${.25 + r() * .2})`; circle(x, y, rr); }
  ctx.translate(fx + sx, fy + sy); ctx.scale(z, z); ctx.translate(-fx, -fy);
  ctx.translate(-cam * EV.S, GY); ctx.scale(EV.S, EV.S);
  // table
  g = ctx.createLinearGradient(0, 0, 0, 560); g.addColorStop(0, '#f1d9c4'); g.addColorStop(.3, '#f1d9c4'); g.addColorStop(1, '#dcbba0'); ctx.fillStyle = g; ctx.fillRect(cam - 200, 0, 1200, 600);
  ctx.strokeStyle = 'rgba(150,105,80,.18)'; ctx.lineWidth = 2; for (let k = Math.floor((cam - 200) / 90); k < (cam + 1000) / 90; k++) { const x = k * 90; ctx.beginPath(); ctx.moveTo(x, 40); ctx.bezierCurveTo(x + 30, 200, x - 20, 380, x + 10, 600); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(cam - 200, 0, 1200, 3);
  ballNow = { x: bx, y: -R - at(EV.lift, t) };
  for (const o of EV.objects) if (o.th && t > o.tb && t < o.tb + .6) { const u = t - o.tb; ballNow.y += 14 * Math.exp(-7 * u) * Math.sin(u * 20); }
  const vis = o => o.x0 + o.w + 400 > cam - 100 && o.x0 - 200 < cam + 1000;
  for (const o of EV.objects) if (vis(o)) remains(o, t);
  for (const f of EV.frags) if (f.z === 0) drawFrag(f, t);
  for (const o of EV.objects) if (vis(o)) DRAW[o.type](o, t);
  ball(t);
  for (const f of EV.frags) if (f.z === 1) drawFrag(f, t);
  // screen space: soft vignette + title
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  g = ctx.createRadialGradient(540, 1000, 650, 540, 1000, 1350); g.addColorStop(0, 'rgba(70,40,60,0)'); g.addColorStop(1, 'rgba(70,40,60,.25)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // what's next: name of the object + counter
  const NAMES = { jelly: 'jelly cube', crayons: 'crayons', wrap: 'bubble wrap', cupcake: 'cupcake', crystal: 'crystals', sand: 'kinetic sand', wafers: 'wafers' };
  EV.objects.forEach((o, i) => {
    const t0 = Math.max(2.4, (EV.track.findIndex(x => x > o.x0 - 620) / EV.fps)), t1 = o.tb + .9; if (t < t0 - .1 || t > t1 + .3 || (i === 0 && t < 2.4)) return;
    const a = clamp((t - t0) / .25) * (1 - clamp((t - t1) / .3)), pop = 1 + .25 * Math.exp(-14 * Math.max(0, t - t0)) * Math.sin(Math.max(0, t - t0) * 30);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(540, 450); ctx.scale(pop, pop); ctx.textAlign = 'center'; ctx.fillStyle = '#5b3d63';
    ctx.font = '600 92px Fredoka'; ctx.fillText(NAMES[o.type], 0, 0); ctx.font = '600 44px Fredoka'; ctx.fillStyle = 'rgba(91,61,99,.6)'; ctx.fillText(`${i + 1} / ${EV.objects.length}`, 0, 70); ctx.restore(); });
  const ca = clamp((t - .1) / .3) * (1 - sm((t - 2.2) / .5));
  if (ca > 0) { ctx.globalAlpha = ca; ctx.textAlign = 'center'; ctx.fillStyle = '#5b3d63'; ctx.font = '600 84px Fredoka'; ctx.fillText('heavy ball', 540, 420); ctx.font = '600 52px Fredoka'; ctx.fillText('vs everything', 540, 490); ctx.globalAlpha = 1; }
}

window.ready = (async () => { EV = await (await fetch('events.json')).json(); R = EV.R; G = EV.G; await document.fonts.load('600 70px Fredoka'); window.DURATION = EV.duration; })();
const q = new URLSearchParams(location.search);
if (!q.has('headless')) { let t = parseFloat(q.get('t') || 0), playing = q.has('play'), last = performance.now();
  window.ready.then(() => { const loop = now => { if (playing) t += (now - last) / 1000; last = now; if (t > EV.duration) t = 0; render(t); document.getElementById('ui').textContent = t.toFixed(2) + 's'; requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
  addEventListener('keydown', e => { if (e.key === ' ') playing = !playing; if (e.key === 'ArrowRight') t += 1; if (e.key === 'ArrowLeft') t = Math.max(0, t - 1); }); }
</script></body></html>
