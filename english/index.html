<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Cuppa English">
<meta name="description" content="Five minutes of English a day — British English practice with Italian help.">
<title>Cuppa English</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3EA; --card:#FFFFFF; --soft:#F0EADC; --ink:#1F2A37; --muted:#5F6B7A; --line:#E4DCCB;
  --navy:#1E3A5F; --navy-soft:#E3EAF3; --coral:#C8513A; --coral-soft:#F8E4DE;
  --ok:#2F7D4F; --ok-soft:#E1F1E7; --bad:#B83A3A; --bad-soft:#F7E0E0; --gold:#B7861B; --gold-soft:#F6EBCF;
  --shadow:0 1px 2px rgba(31,42,55,.06),0 4px 14px rgba(31,42,55,.06);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fs:18px; --tabh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181F; --card:#1C222B; --soft:#232B36; --ink:#ECEFF3; --muted:#A2ACB8; --line:#2E3744;
    --navy:#9CC0EE; --navy-soft:#22324A; --coral:#F0907A; --coral-soft:#3A2722;
    --ok:#7CCB98; --ok-soft:#1E3326; --bad:#F09090; --bad-soft:#3A2323; --gold:#E3B95A; --gold-soft:#3A3020;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181F; --card:#1C222B; --soft:#232B36; --ink:#ECEFF3; --muted:#A2ACB8; --line:#2E3744;
  --navy:#9CC0EE; --navy-soft:#22324A; --coral:#F0907A; --coral-soft:#3A2722;
  --ok:#7CCB98; --ok-soft:#1E3326; --bad:#F09090; --bad-soft:#3A2323; --gold:#E3B95A; --gold-soft:#3A3020;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid transparent;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:44px}
.back{display:none;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:8px 14px 8px 10px;font-size:.9rem;min-height:44px}
.back.show{display:inline-flex}
.crumb{flex:1;min-width:0;font-family:var(--serif);font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:.82rem;font-weight:700;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill.on{background:var(--navy-soft);border-color:var(--navy);color:var(--navy)}

.wrap{max-width:680px;margin:0 auto;padding:4px 16px calc(var(--tabh) + 32px + env(safe-area-inset-bottom))}
#view{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  height:var(--tabh);font-size:.72rem;color:var(--muted);text-decoration:none;font-weight:700;line-height:1.1}
.tab svg{width:24px;height:24px}
.tab small{font-weight:400;font-size:.62rem;opacity:.85}
.tab.active{color:var(--coral)}
.no-it .tab small{display:none}

/* type */
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:1.9rem}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
p{margin:.5em 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.it{color:var(--muted);font-style:italic;font-size:.9em}
.it::before{content:"🇮🇹 ";font-style:normal;font-size:.85em}
.it.noflag::before{content:""}
.no-it .it{display:none}
.no-it .it.reveal-on{display:block}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--coral)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:28px 0 10px}
.section-title h2{font-size:1.2rem}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.stack > * + *{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero{background:var(--navy);color:#fff;border:0;border-radius:22px;padding:20px}
:root[data-theme="dark"] .hero{background:#22324A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:#22324A}}
.hero h2{color:#fff}
.hero .it{color:rgba(255,255,255,.78)}
.hero p{color:rgba(255,255,255,.9)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);padding:12px 18px;font-weight:700;min-height:48px;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1b1b1b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1b1b1b}}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.hero .btn.primary{background:#fff;border-color:#fff;color:var(--navy)}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn.big{font-size:1.1rem;min-height:58px;border-radius:16px}
.btn[disabled]{opacity:.5;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row > .btn{flex:1}
.say{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--navy-soft);color:var(--navy);
  display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem;padding:0}
.say.slow{background:var(--soft);color:var(--muted)}
.say.playing{background:var(--navy);color:#fff;border-color:var(--navy)}
.say svg{width:20px;height:20px}
.star{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.1rem;padding:0}
.star.on{background:var(--gold-soft);border-color:var(--gold)}

/* list rows */
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit;min-height:56px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
a.row:active,button.row:active{background:var(--soft)}
.row .grow{flex:1;min-width:0}
.row .ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.row .chev{color:var(--muted);flex:none}
.row b{display:block}
.chip{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--muted);vertical-align:middle}
.chip.a2{background:var(--ok-soft);color:var(--ok)}
.chip.b1{background:var(--navy-soft);color:var(--navy)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.due{background:var(--coral-soft);color:var(--coral)}

/* tiles */
.tile{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);min-height:120px}
.tile .em{font-size:1.6rem}
.tile b{font-size:1rem}
.tile .it{font-size:.8rem}

/* progress */
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--coral);border-radius:999px;transition:width .3s}
.hero .bar{background:rgba(255,255,255,.2)}
.hero .bar > i{background:#fff}
.week-dots{display:flex;gap:6px;justify-content:space-between;margin-top:12px}
.week-dots span{flex:1;text-align:center;font-size:.7rem;color:var(--muted)}
.week-dots i{display:block;margin:0 auto 4px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-style:normal;line-height:26px;font-size:.8rem}
.week-dots i.on{background:var(--coral);border-color:var(--coral);color:#fff}
.week-dots i.today{border-color:var(--coral)}

/* session */
.sess-head{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.sess-head .bar{flex:1}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.2rem;flex:none}
.step-kind{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);margin-bottom:8px}
.flash{text-align:center;padding:28px 18px}
.flash .word{font-family:var(--serif);font-size:2rem;font-weight:700;line-height:1.15;margin:6px 0 12px;word-break:break-word}
.flash .ex{font-size:1.05rem}
.flash .meaning{font-size:1.3rem;font-weight:700;color:var(--navy);margin-top:14px}
.flash-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn.no{background:var(--bad-soft);border-color:var(--bad-soft);color:var(--bad)}
.btn.yes{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.q{font-size:1.2rem;font-weight:700;line-height:1.4}
.q .gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--coral);text-align:center;color:var(--coral)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.05rem;min-height:54px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:14px;border-radius:14px;padding:12px 14px}
.feedback.ok{background:var(--ok-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b{display:block}
textarea,input[type=text],input[type=search]{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;font-size:1.05rem;outline:none}
textarea:focus,input:focus{border-color:var(--navy)}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.diff span{display:inline-block;margin:2px 3px;padding:1px 6px;border-radius:8px;font-weight:700}
.diff .ok{background:var(--ok-soft);color:var(--ok)}
.diff .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.diff .extra{color:var(--muted);text-decoration:line-through;font-weight:400}
.score{font-family:var(--serif);font-size:2.2rem;font-weight:700}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--coral);color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(200,81,58,.35)}
.mic svg{width:36px;height:36px}
.mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,81,58,.55)}70%{box-shadow:0 0 0 18px rgba(200,81,58,0)}100%{box-shadow:0 0 0 0 rgba(200,81,58,0)}}
.center{text-align:center}

/* phrase line */
.line{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0;padding-top:0}
.line .txt{flex:1;min-width:0}
.line .txt > div:first-child{font-size:1.05rem}
.line .acts{display:flex;gap:6px;flex:none}
.bubble{border-radius:16px;padding:10px 14px;max-width:86%;background:var(--soft)}
.bubble.me{background:var(--navy-soft);margin-left:auto}
.bubble .who{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bubble.speaking{outline:2px solid var(--coral)}
.dlg{display:flex;flex-direction:column;gap:8px}
.dlg-row{display:flex;gap:8px;align-items:flex-end}
.dlg-row.me{flex-direction:row-reverse}
.dlg-row .say{width:38px;height:38px}

/* grammar card */
.rule li{margin:6px 0}
.rule{padding-left:20px;margin:8px 0}
.box{border-radius:14px;padding:12px 14px;margin-top:12px}
.box.it-box{background:var(--navy-soft)}
.box.it-box::before{content:"🇮🇹 In italiano";display:block;font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin-bottom:4px}
.no-it .box.it-box{display:none}
.mistake{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.mistake:first-of-type{border-top:0}
.wrongtxt{color:var(--bad);text-decoration:line-through}
.righttxt{color:var(--ok);font-weight:700}
.wrongtxt::before{content:"✗ ";text-decoration:none;display:inline-block}
.righttxt::before{content:"✓ "}

/* table */
.vt{width:100%;border-collapse:collapse;font-size:.95rem}
.vt th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 6px}
.vt td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:top}
.vt td.b{font-weight:700}
.vt tr{cursor:pointer}

/* search */
.search{position:relative}
.search input{padding-left:44px;font-size:1.1rem;min-height:54px;border-radius:16px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted)}
.res-type{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--coral)}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hint{border-left:4px solid var(--bad);background:var(--card);border-radius:12px;padding:10px 12px;margin-top:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.hint.tip{border-left-color:var(--navy)}
.hint .found{font-weight:700}
mark{background:var(--bad-soft);color:inherit;border-radius:4px;padding:0 2px}
mark.tip{background:var(--navy-soft)}
.preview{white-space:pre-wrap;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:.9rem;min-height:40px}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.streak{display:flex;align-items:center;gap:12px}
.streak .num{font-family:var(--serif);font-size:2rem;font-weight:700;line-height:1}
.pair{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair .w{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.pair .w b{font-size:1.1rem}
.vs{color:var(--muted);font-size:.8rem}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0}
.switch{position:relative;width:56px;height:32px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch span::after{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + span{background:var(--ok)}
.switch input:checked + span::after{transform:translateX(24px)}
select{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:10px;max-width:100%}
input[type=range]{width:100%;accent-color:var(--coral)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:10px 8px;min-height:44px;font-weight:700}
.seg button.on{background:var(--navy);color:#fff}
.done-big{font-size:3.5rem;text-align:center;margin:10px 0}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media (min-width:560px){ h1{font-size:2.2rem} .grid3{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top-in">
    <button class="back" id="back" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Back</button>
    <div class="crumb" id="crumb">Cuppa English</div>
    <button class="pill" id="itToggle" aria-pressed="true" title="Show Italian help">🇮🇹 IT</button>
    <a class="pill" href="#/settings" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
  </div>
</header>

<main class="wrap"><div id="view"></div></main>

<nav class="tabs" aria-label="Main">
