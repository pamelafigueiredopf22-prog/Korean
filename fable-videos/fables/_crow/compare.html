<!doctype html><html><head><meta charset="utf-8">
<style>@font-face { font-family: Fell; src: url(../../engine/fonts/im-fell-english-latin-400-italic.woff2); }</style>
</head><body style="margin:0"><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// crow.js (approved) beside crow3 at rest, same scale:  PAGE=compare.html node tools/render.js _crow --stills 0
import { paper } from '../../engine/watercolor.js';
import { makeCrow } from '../../engine/characters/crow.js';
import { makeCrow3 } from '../../engine/characters/crow3.js';
const ctx = document.getElementById('c').getContext('2d');
let P, a, b;
await document.fonts.load('40px Fell');
window.FABLE = {
  async setup() { P = paper(); a = makeCrow(2.6); b = makeCrow3(2.6); },
  frame(t) {
    const g = ctx; g.drawImage(P, 0, 0);
    const z = new URLSearchParams(location.search).get('pose');
    const st = z ? JSON.parse(z) : {};
    g.save(); g.translate(500, 820); g.scale(2.4, 2.4); a.draw(g, { t: 0 }); g.restore();
    g.save(); g.translate(1420, 820); g.scale(2.4, 2.4); b.shadow(g, {}); b.draw(g, { t: 0.3, life: 0, noBlink: true, ...st }); g.restore();
    g.fillStyle = '#4a3a2c'; g.font = 'italic 44px Fell, serif';
    g.fillText('crow.js (approved)', 300, 960); g.fillText('crow3 (rig), rest pose', 1200, 960);
  }
};
</script></body></html>
