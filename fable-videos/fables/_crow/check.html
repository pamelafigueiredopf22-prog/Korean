<!doctype html><html><body style="margin:0"><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// Numeric check of the reel: does a foot that touches the ground ever slide? (results go to the console)
//   PAGE=check.html node tools/render.js _crow --stills 0
import { REEL, SEGS, crow } from './reel.js';
window.FABLE = {
  async setup() {
    await REEL.setup();
    const fps = 60, out = [];
    for (const [t0, t1, label, fn] of SEGS) {
      let prev = null, worst = 0, at = 0, n = 0;
      for (let t = t0; t < t1 - 1e-6; t += 1 / fps) {
        const r = fn(t, t0), s = r.s || 1.75, poseFn = r.fn || ((tt) => fn(tt, t0).st);
        const f = crow.feetAt(poseFn, t, { since: t0 }).map((p) => ({ x: r.x + p.x * s, y: r.y + p.y * s, ground: Math.abs(p.y + 3) < 0.05 }));
        if (prev) for (let i = 0; i < 2; i++) if (f[i].ground && prev[i].ground) { const d = Math.hypot(f[i].x - prev[i].x, f[i].y - prev[i].y); n++; if (d > worst) { worst = d; at = t - t0; } }
        prev = f;
      }
      out.push(`${label}: planted-foot max slip ${worst.toFixed(2)} px/frame at ${at.toFixed(2)}s (${n} planted samples)`);
    }
    console.warn(out.join('\n'));
  },
  frame() {}
};
</script></body></html>
