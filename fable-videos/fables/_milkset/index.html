<!doctype html><html><head><meta charset="utf-8"><title>The Milkmaid: sets</title>
<style>html,body{margin:0;background:#222}canvas{display:block;max-width:100vw;height:auto}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// Test reel of The Milkmaid and Her Pail scenery: every set in every mood, wide and close, with the ambient life.
//   node tools/render.js _milkset --stills 3,9,15,...      (each segment is 6 s; segment i covers [6i, 6i+6))
//   index.html?only=farm,lane   paint only some sets at set-up (faster);  ?clean: no labels
import { makeStage } from '../../engine/stage.js';
import * as SC from '../milkmaid/scene.js';
const { view } = SC;
let S;
const SEGS = [];
const seg = (label, set, fn) => SEGS.push([label, set, fn]);
const LEN = 6, Q = new URLSearchParams(location.search), CLEAN = Q.has('clean');
const ONLY = Q.get('only') ? Q.get('only').split(',') : null;
// a stand-in figure (the stager draws Molly): a simple silhouette, personH tall, to check scale and spots
function stand(g, x, y, h, col = 'rgba(60,50,80,0.55)') {
  g.save(); g.fillStyle = col; g.beginPath(); g.ellipse(x, y - h * 0.9, h * 0.08, h * 0.1, 0, 0, 7); g.fill();
  g.beginPath(); g.moveTo(x - h * 0.06, y - h * 0.8); g.lineTo(x + h * 0.06, y - h * 0.8); g.lineTo(x + h * 0.16, y - h * 0.08); g.lineTo(x - h * 0.16, y - h * 0.08); g.fill();
  g.fillRect(x - h * 0.06, y - h * 0.1, h * 0.04, h * 0.1); g.fillRect(x + h * 0.02, y - h * 0.1, h * 0.04, h * 0.1); g.restore();
}
const SHOW = Q.has('spots');
const farmSpots = (g) => { if (!SHOW) return; const P = SC.FARM.personH; stand(g, SC.STOOL.x, SC.STOOL.y, P(SC.STOOL.y)); stand(g, SC.DOOR[0], SC.DOOR[1], P(SC.DOOR[1])); stand(g, SC.GATE.x, SC.GATE.y, P(SC.GATE.y));
  g.fillStyle = 'rgba(120,70,40,0.45)'; g.beginPath(); g.ellipse(SC.COW.x, SC.COW.y - 150, 200, 75, 0, 0, 7); g.fill(); };
// 0-7: the farmyard
seg('farm - dawn - wide', 'farm', (g, t) => SC.drawFarm(g, t, view(960, 540, 1), 'dawn', { actors: farmSpots }));
seg('farm - dawn - close on the cow and stool', 'farm', (g, t) => SC.drawFarm(g, t, view(1480, 700, 2.0), 'dawn', { actors: farmSpots }));
seg('farm - dawn - close on the door', 'farm', (g, t) => SC.drawFarm(g, t, view(380, 520, 2.2), 'dawn'));
seg('farm - dawn - gate opening, mist lifting', 'farm', (g, t, u) => SC.drawFarm(g, t, view(1000, 560, 1.6), 'dawn', { gateOpen: Math.min(1, u / 4), mistLift: u / 6 }));
seg('farm - dusk - wide', 'farm', (g, t) => SC.drawFarm(g, t, view(960, 540, 1), 'dusk'));
seg('farm - dusk - close on the hen house', 'farm', (g, t) => SC.drawFarm(g, t, view(860, 620, 2.2), 'dusk'));
seg('farm - night - wide', 'farm', (g, t) => SC.drawFarm(g, t, view(960, 540, 1), 'night'));
seg('farm - night - the byre (goodnight round)', 'farm', (g, t) => SC.drawFarm(g, t, view(1560, 600, 1.8), 'night'));
// 8-12: the lane, side-on travelling (multiplane); the stand-in walks at page x 960 with its feet on the ground line
const walker = (scroll) => (g) => { if (Q.has('nowalker')) return; stand(g, 960, SC.LANE_PAN.groundAt(960, scroll), SC.LANE_PAN.feetH); };
const laneSeg = (label, s0, speed, z = 1, cy = 540) => seg(label, 'lane', (g, t, u) => { const sc = s0 + u * speed; SC.drawLaneParallax(g, SC.laneParallax('morning'), view(960, cy, z), sc, t, { actors: walker(sc) }); });
laneSeg('lane - walk from the start', 0, 70);
laneSeg('lane - the stile in the hedge', 1300 - 210, 70);
laneSeg('lane - over the little bridge', 2600 - 210, 70);
laneSeg('lane - the stony bit (spill spot), close', 4500 - 210, 70, 1.5, 640);
laneSeg('lane - the end of the walk', 4800 - 420, 70);
// 13-15: the lane, wide (2x), and the spilt milk
seg('lane wide - morning (stand-in walking down the lane)', 'lane', (g, t, u) => SC.drawLaneWide(g, t, view(960, 540, 1), 'morning', { actors: (g) => { const p = SC.LANE_WIDE.laneAt(0.45 + u * 0.05); if (SHOW) stand(g, p.x, p.y, SC.LANE_PAN.feetH * p.s); } }));
seg('lane wide - close on the stony bit, milk spilling', 'lane', (g, t, u) => SC.drawLaneWide(g, t, view(1080, 720, 2.0), 'morning', { actors: (g) => SC.drawSpill(g, SC.LANE_WIDE.SPILL[0], SC.LANE_WIDE.SPILL[1] + 6, u / 5, t, { scale: SC.LANE_WIDE.scaleAt(SC.LANE_WIDE.SPILL[1]) }) }));
seg('lane side-on - the spill spreading (close)', 'lane', (g, t, u) => { const sc = SC.LANE_PAN.spillAt; SC.drawLaneParallax(g, SC.laneParallax('morning'), view(960, 700, 1.8), sc, t, { actors: (g) => { const [x, y] = SC.LANE_PAN.spillPoint(sc); SC.drawSpill(g, x + 60, y, u / 5, t); } }); });
// 16-19: the daydream, over the lane (the stand-in is Molly; the stager draws the chicks, hens and Molly in the dress)
const DX = 1400, DY = 300, DW = 700, DH = 460, lanePause = 1700;
const overLane = (fn) => (g, t, u) => SC.drawLaneParallax(g, SC.laneParallax('morning'), view(1100, 520, 1.15), lanePause, t, { actors: walker(lanePause), after: (g) => fn(g, t, u) });
const henSpots = (g) => { if (!SHOW) return; for (const n of ['hen1', 'hen2', 'hen3']) { const [x, y] = SC.dreamSpot('hens', n, DX, DY, DW, DH); g.fillStyle = 'rgba(160,90,50,0.6)'; g.beginPath(); g.ellipse(x, y - 24, 30, 24, 0, 0, 7); g.fill(); } };
seg('dream - eggs in the basket (appearing; then hatching)', 'dream', overLane((g, t, u) => SC.drawDream(g, DX, DY, DW, DH, t, Math.min(1, u / 2), { scene: 'eggs', tail: [985, 575], eggs: { crack: Math.max(0, (u - 3) / 2.5) } })));
seg('dream - the sunny hen run (melting in from the eggs)', 'dream', overLane((g, t, u) => SC.drawDream(g, DX, DY, DW, DH, t, 1, { scene: 'hens', from: 'eggs', mix: u / 2.5, tail: [985, 575], inside: henSpots })));
seg('dream - the shop window with the blue dress', 'dream', overLane((g, t, u) => SC.drawDream(g, DX, DY, DW, DH, t, 1, { scene: 'shop', from: 'hens', mix: u / 2.5, tail: [985, 575] })));
seg('dream - the country fair', 'dream', overLane((g, t, u) => SC.drawDream(g, DX, DY, DW, DH, t, 1, { scene: 'fair', from: 'shop', mix: u / 2.5, tail: [985, 575], inside: (g) => { if (!SHOW) return; const [x, y] = SC.dreamSpot('fair', 'molly', DX, DY, DW, DH); stand(g, x, y, 160, 'rgba(70,100,170,0.7)'); } })));
// 20-22: Molly's bedroom
const sleeper = (g) => { g.fillStyle = 'rgba(200,140,110,0.9)'; g.beginPath(); g.ellipse(SC.BEDROOM.head[0], SC.BEDROOM.head[1] - 6, 30, 26, 0, 0, 7); g.fill(); g.fillStyle = 'rgba(150,90,50,0.9)'; g.beginPath(); g.ellipse(SC.BEDROOM.head[0] - 14, SC.BEDROOM.head[1] - 14, 26, 22, 0, 0, 7); g.fill(); };
seg('bedroom - candle - wide (Molly asleep)', 'bed', (g, t) => SC.drawBedroom(g, t, view(960, 540, 1), { sleeper }));
seg('bedroom - candle - close on the bed and window', 'bed', (g, t) => SC.drawBedroom(g, t, view(860, 520, 1.8), { sleeper }));
seg('bedroom - the candle going out', 'bed', (g, t, u) => SC.drawBedroom(g, t, view(900, 560, 1.25), { sleeper, candle: Math.max(0, 1 - u / 3) }));
if (Q.has('debug')) seg('debug: byre end x3', 'farm', (g, t) => SC.drawFarm(g, t, view(1240, 440, 3), 'dusk', { ambient: false }));
window.SEGS = SEGS;
function draw(g, t) {
  const i = Math.min(SEGS.length - 1, Math.floor(t / LEN)), u = t - i * LEN;
  S.paperBg(g);
  SEGS[i][2](g, t, u);
  if (!CLEAN) { g.setTransform(1, 0, 0, 1, 0, 0); g.font = '22px Georgia'; g.fillStyle = 'rgba(255,250,240,0.85)'; g.fillText(`${i}: ${SEGS[i][0]}`, 60, 70); }
}
window.FABLE = {
  async setup(tl) {
    S = makeStage(tl); await S.setup(document.getElementById('c')); S.captions = false;
    const t0 = performance.now();
    const want = (k) => !ONLY || ONLY.includes(k);
    if (want('farm')) for (const m of ['dawn', 'dusk', 'night']) SC.farmLayers(m);
    if (want('lane')) { SC.laneParallax('morning'); if (SC.laneWideLayers) SC.laneWideLayers('morning'); }
    if (want('bed')) SC.bedroomLayers();
    console.warn('sets painted in', ((performance.now() - t0) / 1000).toFixed(1), 's', JSON.stringify(Object.fromEntries(Object.entries(SC.TIMING).map(([k, v]) => [k, Math.round(v)]))));
  },
  frame(t) { S.frame(t, [[0, draw]], 0.001); },
};
</script></body></html>
