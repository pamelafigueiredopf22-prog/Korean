<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0"><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// planted-foot drift check (PAGE=check.html node tools/render.js _milk --stills 0): prints the largest movement of a
// foot that stays planted between two frames, in page pixels, for each walking test
import { makeMilkmaid, STRIDE as MS } from '../../engine/characters/milkmaid.js';
import { makeMother, STRIDE as WS } from '../../engine/characters/farmwife.js';
import { makeCow, STRIDE as CS } from '../../engine/characters/cow.js';
window.FABLE = { setup: async () => {
  const sd = (u) => { const a = 0.22, v = 1 / (1 - a); if (u <= 0) return 0; if (u >= 1) return 1; if (u < a) return v * u * u / (2 * a); if (u > 1 - a) return 1 - v * (1 - u) * (1 - u) / (2 * a); return v * (a / 2 + (u - a)); };
  const on = (q, a, b, r) => Math.min(1, Math.max(0, (q - a) / r)) * Math.min(1, Math.max(0, (b - q) / r));
  const test = (name, rig, S, extra, getFeet) => {
    let worst = 0, worstMid = 0, worstX = 0;
    const D = 4 * rig.STRIDE, dist = (q) => D * sd(Math.min(1, Math.max(0, (q - 0.3) / 3.9)));
    const pose = (tt) => ({ t: tt, walk: dist(tt) / rig.STRIDE, walkAmt: on(tt, 0.1, 4.4, 0.5), ...extra });
    let prev = null;
    for (let f = 0; f < 140; f++) { const t = f / 30, o = { x: 1300 - dist(t) * S, y: 900, scale: S, face: 1, since: 0 };
      const ft = getFeet(rig, pose, t, o); if (prev) ft.forEach((p, i) => { if (p.planted && prev[i].planted) { const d = Math.hypot(p.x - prev[i].x, p.y - prev[i].y); worst = Math.max(worst, d); worstX = Math.max(worstX, Math.abs(p.x - prev[i].x)); if (pose(t).walkAmt >= 1) { worstMid = Math.max(worstMid, Math.abs(p.x - prev[i].x)); if (name === 'cow walk' && Math.abs(p.x - prev[i].x) > 1) console.error(`  cow f${f} leg${i} dx ${(p.x - prev[i].x).toFixed(2)} walk ${pose(t).walk.toFixed(3)}`); } } }); prev = ft; }
    console.error(`[drift] ${name}: any ${worst.toFixed(2)} px, horizontal ${worstX.toFixed(2)}, horizontal while fully walking ${worstMid.toFixed(2)}`);
  };
  const m = makeMilkmaid(1), w = makeMother(1), c = makeCow(1);
  test('molly walk', m, 1.5, {}, (r, p, t, o) => r.feetAt(p, t, o));
  test('molly skip', m, 1.5, { skip: 1 }, (r, p, t, o) => r.feetAt(p, t, o));
  test('molly sad walk + pail', m, 1.5, { sadWalk: 1, pailOn: 'hand' }, (r, p, t, o) => r.feetAt(p, t, o));
  test('molly pail on head', m, 1.5, { pailOn: 'head', pailHands: 1 }, (r, p, t, o) => r.feetAt(p, t, o));
  test('mother walk', w, 1.4, {}, (r, p, t, o) => r.feetAt(p, t, o));
  test('cow walk', c, 1.3, {}, (r, p, t, o) => r.hoovesAt(p, t, o));
}, frame: () => {} };
</script></body></html>
