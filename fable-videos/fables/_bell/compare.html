<!doctype html><html><head><meta charset="utf-8">
<style>@font-face { font-family: Fell; src: url(../../engine/fonts/im-fell-english-latin-400-italic.woff2); }</style>
</head><body style="margin:0"><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// look check: approved makeMouse2 / makeCat (top) vs the new rigs (bottom), same scale and facing
//   PAGE=compare.html node tools/render.js _bell --stills 1
import { paper } from '../../engine/watercolor.js';
import { makeMouse2, makeCat } from '../../engine/characters/mice.js';
import { makeMouseRig } from '../../engine/characters/mice3.js';
import { makeCatRig } from '../../engine/characters/cat3.js';
const g = document.getElementById('c').getContext('2d');
await document.fonts.load('40px Fell');
let P, a, b, c, A, B, C;
window.FABLE = {
  async setup() {
    P = paper();
    a = makeMouse2(2, 51, { fur: '#a8988a', dress: '#a898c0' }); b = makeMouse2(2, 52, { fur: '#8a7a6e', coat: '#3e5a8a', hat: '#2e2a30' }); c = makeCat(1.2);
    A = makeMouseRig(2, 51, 'mother'); B = makeMouseRig(2, 52, 'plump'); C = makeCatRig(1.2);
  },
  frame(t) {
    g.drawImage(P, 0, 0);
    const lab = (s, x, y) => { g.save(); g.fillStyle = '#4a3a2c'; g.font = 'italic 34px Fell, serif'; g.fillText(s, x, y); g.restore(); };
    lab('approved: makeMouse2, makeCat (mice.js)', 60, 60); lab('new rigs: makeMouseRig (mice3.js), makeCatRig (cat3.js)', 60, 580);
    // old ones face right natively: mirror them to face left like the rigs
    const old = (x, y, s, f) => { g.save(); g.translate(x, y); g.scale(-s, s); f(); g.restore(); };
    old(260, 470, 1.6, () => a.draw(g, { t: 2, mouth: 0.5 })); old(560, 470, 1.6, () => b.draw(g, { t: 2 }));
    old(1150, 470, 0.85, () => c.draw(g, { t: 2 }));
    const rig = (x, y, s, R, st) => { g.save(); g.translate(x, y); g.scale(s, s); R.shadow(g, {}); R.drawAt(g, () => ({ t: 2, life: 0, ...st }), 4, { since: 0 }); g.restore(); };
    rig(260, 1010, 1.6, A, { mouth: 0.5 }); rig(560, 1010, 1.6, B, {});
    rig(1300, 1010, 0.85, C, {});
  },
};
</script></body></html>
