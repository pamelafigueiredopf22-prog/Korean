<title>GCSE Mock Flashcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one centred study column; the card is the only raised object. Chemistry = green, maths = blue. */
:root{
  --bg:#f3f5f8;--surface:#ffffff;--ink:#1b2230;--muted:#5a6476;--line:#d9dee8;
  --chem:#0d7a5f;--maths:#3550c8;--good:#18804a;--bad:#c23b3b;--focus:#ffb000;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Lexend",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161f;--surface:#1c2230;--ink:#eef1f7;--muted:#9aa4b8;--line:#313a4c;
  --chem:#3cc79f;--maths:#8197ff;--good:#45c47f;--bad:#ff7a7a;--focus:#ffd166;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f;--surface:#1c2230;--ink:#eef1f7;--muted:#9aa4b8;--line:#313a4c;
  --chem:#3cc79f;--maths:#8197ff;--good:#45c47f;--bad:#ff7a7a;--focus:#ffd166;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
main{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:800 1.6rem/1.1 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:8px}
select,button{font:inherit;font-size:1rem;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px}
select{flex:1 1 150px;min-width:0}
button:focus-visible,select:focus-visible,.card:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.stats{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter div{height:100%;background:var(--good);width:0;transition:width .3s}
.card{perspective:1200px;height:min(340px,60vh);min-height:260px;cursor:pointer;user-select:none;border-radius:18px}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.inner,.meter div{transition:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:48px 22px 36px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.08);overflow:auto}
.back{transform:rotateY(180deg)}
.tag{position:absolute;top:12px;left:14px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;color:var(--surface);background:var(--c)}
.hint{position:absolute;bottom:10px;font-size:.8rem;color:var(--muted)}
.txt{font-size:1.3rem;max-width:34ch}
.back .txt{font-size:1.15rem}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate .no{border-color:var(--bad);color:var(--bad);font-weight:700}
.rate .yes{border-color:var(--good);color:var(--good);font-weight:700}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.done{text-align:center;padding:36px 10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done h2{font:800 1.4rem var(--display);margin:0}
.primary{background:var(--maths);color:var(--surface);border-color:transparent;font-weight:700}
</style>
<main>
  <div>
    <h1>GCSE Mock Flashcards</h1>
    <p class="sub">Edexcel Chemistry Paper 2 (Foundation) · Maths Paper 1 (Higher, non-calculator)</p>
  </div>
  <div class="bar">
    <select id="subj" aria-label="Subject"><option value="all">Both subjects</option><option>Chemistry</option><option>Maths</option></select>
    <select id="topic" aria-label="Topic"><option value="all">All topics</option></select>
    <select id="triple" aria-label="Triple only cards"><option value="yes">Include Triple only</option><option value="no">Combined Science (hide Triple only)</option></select>
  </div>
  <div class="bar"><button id="shuffle">Shuffle</button><button id="reset">Restart in order</button></div>
  <div class="stats" id="stats"></div>
  <div class="meter" aria-hidden="true"><div id="meter"></div></div>
  <div id="area"></div>
</main>
<script>
const CARDS=/*CARDS*/[];
let deck=[],i=0,known=0,again=[];
const $=id=>document.getElementById(id);
const pool=()=>CARDS.filter(c=>($('subj').value==='all'||c.s===$('subj').value)&&($('triple').value==='yes'||c.t!=='Triple only'));
function topics(){const t=[...new Set(pool().map(c=>c.t))];$('topic').innerHTML='<option value="all">All topics</option>'+t.map(x=>`<option>${x}</option>`).join('');}
function build(shuffle){const t=$('topic').value;deck=pool().filter(c=>t==='all'||c.t===t);
 if(shuffle)for(let k=deck.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[deck[k],deck[j]]=[deck[j],deck[k]];}
 i=0;known=0;again=[];render();}
const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function render(){
 $('stats').textContent=deck.length?`Card ${Math.min(i+1,deck.length)} of ${deck.length} · Got it: ${known} · To practise again: ${again.length}`:'No cards match these filters.';
 $('meter').style.width=deck.length?(100*Math.min(i,deck.length)/deck.length)+'%':'0';
 if(!deck.length){$('area').innerHTML='';return;}
 if(i>=deck.length){$('area').innerHTML=`<div class="done"><h2>Round finished</h2><p>You knew ${known} of ${deck.length}.</p>${again.length?'<button class="primary" id="redo">Practise the '+again.length+' I missed</button>':'<p>Perfect round.</p>'}</div>`;
  if(again.length)$('redo').onclick=()=>{deck=again;i=0;known=0;again=[];render();};return;}
 const c=deck[i],col=c.s==='Chemistry'?'var(--chem)':'var(--maths)';
 $('area').innerHTML=`<div class="card" id="card" tabindex="0" role="button" aria-label="Flip card"><div class="inner">
  <div class="face" style="--c:${col}"><span class="tag">${c.s} · ${c.t}</span><div class="txt">${esc(c.q)}</div><span class="hint">Tap to see the answer</span></div>
  <div class="face back" style="--c:${col}"><span class="tag">Answer</span><div class="txt">${esc(c.a)}</div></div></div></div>
  <div class="rate" style="margin-top:12px"><button class="no" id="no">✗ Need practice</button><button class="yes" id="yes">✓ Got it</button></div>
  <div class="nav" style="margin-top:10px"><button id="prev">← Back</button><button id="skip">Skip →</button></div>`;
 const flip=()=>$('card').classList.toggle('flipped');
 $('card').onclick=flip;$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}};
 $('yes').onclick=()=>{known++;i++;render();};
 $('no').onclick=()=>{again.push(c);i++;render();};
 $('prev').onclick=()=>{if(i>0){i--;render();}};
 $('skip').onclick=()=>{i++;render();};}
$('subj').onchange=()=>{topics();build(false);};$('triple').onchange=()=>{topics();build(false);};
$('topic').onchange=()=>build(false);$('shuffle').onclick=()=>build(true);$('reset').onclick=()=>build(false);
topics();build(false);
</script>
