<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCSE Mock Flashcards</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--muted:#5d6678;--chem:#0f8a6a;--maths:#3a5bd9;--line:#dfe3ec;--good:#1a9b54;--bad:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#141821;--card:#1f2532;--ink:#eef1f7;--muted:#9aa4b8;--line:#323a4b;--chem:#3cc79f;--maths:#7d98ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:4px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
select,button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--maths);color:#fff;border-color:transparent}
.stats{color:var(--muted);font-size:.9rem;margin-bottom:10px}
.card{perspective:1200px;height:300px;cursor:pointer;user-select:none}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.07);overflow:auto}
.back{transform:rotateY(180deg)}
.tag{position:absolute;top:12px;left:14px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;color:#fff}
.hint{position:absolute;bottom:10px;font-size:.78rem;color:var(--muted)}
.txt{font-size:1.25rem}
.back .txt{font-size:1.12rem}
.rate{display:flex;gap:10px;margin-top:14px}
.rate button{flex:1;padding:12px}
.rate .no{border-color:var(--bad);color:var(--bad)}
.rate .yes{border-color:var(--good);color:var(--good)}
.nav{display:flex;justify-content:space-between;margin-top:10px}
.done{text-align:center;padding:40px 10px}
</style>
</head>
<body>
<main>
<h1>GCSE Mock Flashcards</h1>
<div class="bar">
  <select id="subj"><option value="all">Both subjects</option><option>Chemistry</option><option>Maths</option></select>
  <select id="topic"><option value="all">All topics</option></select>
  <button id="shuffle">Shuffle</button>
  <button id="reset">Restart</button>
</div>
<div class="stats" id="stats"></div>
<div id="area"></div>
</main>

"Chemistry", "t": "Key concepts", "q": "What is covalent bonding?", "a": "Non-metal atoms sharing pairs of electrons."}, {"s": "Chemistry", "t": "Key concepts", "q": "Why do simple molecular substances have low melting points?", "a": "Weak forces between the molecules are easy to overcome."}, {"s": "Chemistry", "t": "Key concepts", "q": "Formulas of hydroxide, nitrate, carbonate, sulfate, ammonium ions?", "a": "OH⁻, NO₃⁻, CO₃²⁻, SO₄²⁻, NH₄⁺"}, {"s": "Chemistry", "t": "Key concepts", "q": "Formula of magnesium chloride (Mg²⁺, Cl⁻)?", "a": "MgCl₂ (charges must cancel)."}, {"s": "Chemistry", "t": "Key concepts", "q": "Balance: Mg + O₂ → MgO", "a": "2Mg + O₂ → 2MgO"}, {"s": "Chemistry", "t": "Key concepts", "q": "Relative formula mass of CO₂? (C = 12, O = 16)", "a": "12 + 16 + 16 = 44"}, {"s": "Chemistry", "t": "Key concepts", "q": "Relative formula mass of CaCO₃? (Ca = 40, C = 12, O = 16)", "a": "40 + 12 + 48 = 100"}, {"s": "Chemistry", "t": "Key concepts", "q": "A reaction seems to lose mass. Why?", "a": "A gas was produced and escaped."}, {"s": "Chemistry", "t": "Key concepts", "q": "What is an empirical formula? Empirical formula of C₂H₆?", "a": "Simplest whole-number ratio of atoms. CH₃."}, {"s": "Chemistry", "t": "Key concepts", "q": "Formula for concentration in g/dm³?", "a": "Mass (g) ÷ volume (dm³). 1 dm³ = 1000 cm³."}, {"s": "Chemistry", "t": "Key concepts", "q": "10 g dissolved in 250 cm³. Concentration?", "a": "250 cm³ = 0.25 dm³. 10 ÷ 0.25 = 40 g/dm³."}, {"s": "Chemistry", "t": "Group 1", "q": "Properties of the alkali metals?", "a": "1 outer electron, soft, low melting points, stored under oil, very reactive."}, {"s": "Chemistry", "t": "Group 1", "q": "Alkali metal + water → ?", "a": "Metal hydroxide + hydrogen. e.g. 2Na + 2H₂O → 2NaOH + H₂"}, {"s": "Chemistry", "t": "Group 1", "q": "What do you see when sodium reacts with water?", "a": "Fizzes, melts into a ball, moves around on the surface."}, {"s": "Chemistry", "t": "Group 1", "q": "What do you see when potassium reacts with water?", "a": "Very fast, melts, lilac flame, may spark."}, {"s": "Chemistry", "t": "Group 1", "q": "Trend in reactivity down Group 1, and why?", "a": "Increases. Outer electron further from nucleus → less attraction → lost more easily."}, {"s": "Chemistry", "t": "Group 7", "q": "Colour and state of chlorine, bromine, iodine?", "a": "Chlorine: yellow-green gas. Bromine: red-brown liquid. Iodine: dark grey solid (purple vapour)."}, {"s": "Chemistry", "t": "Group 7", "q": "What does diatomic mean?", "a": "Two atoms joined together, e.g. Cl₂."}, {"s": "Chemistry", "t": "Group 7", "q": "Trend in reactivity down Group 7, and why?", "a": "Decreases. Outer shell further from nucleus → harder to attract (gain) an electron."}, {"s": "Chemistry", "t": "Group 7", "q": "Trend in melting and boiling points down Group 7?", "a": "Increase."}, {"s": "Chemistry", "t": "Group 7", "q": "Test for chlorine?", "a": "Damp blue litmus paper → red then bleached white."}, {"s": "Chemistry", "t": "Group 7", "q": "What is a displacement reaction?", "a": "A more reactive halogen displaces a less reactive one from a solution of its salt."}, {"s": "Chemistry", "t": "Group 7", "q": "Chlorine + potassium bromide → ?", "a": "Potassium chloride + bromine (solution turns orange)."}, {"s": "Chemistry", "t": "Group 7", "q": "Will iodine react with potassium chloride? Why?", "a": "No: iodine is less reactive than chlorine."}, {"s": "Chemistry", "t": "Group 7", "q": "Halogen + metal → ?   Hydrogen halide + water → ?", "a": "Metal halide (a salt).   An acid (e.g. hydrochloric acid)."}, {"s": "Chemistry", "t": "Group 0", "q": "Why are the noble gases unreactive?", "a": "They have a full outer shell, so they don't need to lose or gain electrons."}, {"s": "Chemistry", "t": "Group 0", "q": "Uses of helium and argon, and why?", "a": "Helium: balloons (less dense than air, not flammable). Argon: light bulbs and welding (inert)."}, {"s": "Chemistry", "t": "Group 0", "q": "Trend in boiling point and density down Group 0?", "a": "Both increase."}, {"s": "Chemistry", "t": "Rates", "q": "What is the rate of reaction?", "a": "How fast reactants are used up or products are formed."}, {"s": "Chemistry", "t": "Rates", "q": "60 cm³ of gas in 30 s. Mean rate?", "a": "60 ÷ 30 = 2 cm³/s"}, {"s": "Chemistry", "t": "Rates", "q": "What is activation energy?", "a": "The minimum energy particles need to react when they collide."}, {"s": "Chemistry", "t": "Rates", "q": "Why does increasing temperature increase rate?", "a": "Particles move faster → more frequent collisions AND more collisions with enough energy."}, {"s": "Chemistry", "t": "Rates", "q": "Why does increasing concentration increase rate?", "a": "More particles in the same volume → more frequent collisions."}, {"s": "Chemistry", "t": "Rates", "q": "Why does increasing gas pressure increase rate?", "a": "Same particles in a smaller space → more frequent collisions."}, {"s": "Chemistry", "t": "Rates", "q": "Why does powder react faster than lumps?", "a": "Bigger surface area → more particles exposed → more frequent collisions."}, {"s": "Chemistry", "t": "Rates", "q": "What is a catalyst? What are enzymes?", "a": "Speeds up a reaction without being used up, by lowering activation energy. Enzymes = biological catalysts."}, {"s": "Chemistry", "t": "Rates", "q": "Core practical: marble chips + hydrochloric acid. What do you measure?", "a": "Volume of CO₂ gas (gas syringe) or mass lost (balance) over time."}, {"s": "Chemistry", "t": "Rates", "q": "Core practical: sodium thiosulfate + hydrochloric acid. What do you measure?", "a": "Time for the cross to disappear (the solution goes cloudy)."}, {"s": "Chemistry", "t": "Rates", "q": "What does a flat line on a rate graph mean?", "a": "The reaction has finished (a reactant has run out)."}, {"s": "Chemistry", "t": "Energy", "q": "Exothermic vs endothermic?", "a": "Exothermic gives out heat (temperature rises). Endothermic takes in heat (temperature falls)."}, {"s": "Chemistry", "t": "Energy", "q": "Two examples of exothermic reactions?", "a": "Combustion and neutralisation."}, {"s": "Chemistry", "t": "Energy", "q": "Two examples of endothermic reactions?", "a": "Thermal decomposition; dissolving ammonium nitrate (also citric acid + sodium hydrogencarbonate)."}, {"s": "Chemistry", "t": "Energy", "q": "Why use a polystyrene cup in energy practicals?", "a": "It is an insulator, so less heat is lost."}, {"s": "Chemistry", "t": "Energy", "q": "Is bond breaking exothermic or endothermic? Bond making?", "a": "Breaking: endothermic (takes energy). Making: exothermic (releases energy)."}, {"s": "Chemistry", "t": "Energy", "q": "Formula for energy change using bond energies?", "a": "Energy to break bonds − energy released making bonds. Negative = exothermic."}, {"s": "Chemistry", "t": "Energy", "q": "H₂ + Cl₂ → 2HCl. H–H 436, Cl–Cl 242, H–Cl 431. Energy change?", "a": "678 − 862 = −184 kJ/mol (exothermic)"}, {"s": "Chemistry", "t": "Energy", "q": "On a reaction profile, how do you spot an exothermic reaction?", "a": "Products are lower in energy than reactants."}, {"s": "Chemistry", "t": "Energy", "q": "On a reaction profile, what is the activation energy?", "a": "The rise from the reactants to the top of the curve."}, {"s": "Chemistry", "t": "Fuels", "q": "What is a hydrocarbon?", "a": "A compound of hydrogen and carbon only."}, {"s": "Chemistry", "t": "Fuels", "q": "What is crude oil?", "a": "A finite, complex mixture of hydrocarbons (mostly alkanes); source of fuels and feedstock for plastics."}, {"s": "Chemistry", "t": "Fuels", "q": "How does fractional distillation work?", "a": "Oil evaporated; column hot at bottom, cool at top; fractions condense at their boiling points."}, {"s": "Chemistry", "t": "Fuels", "q": "Fractions in order from top to bottom?", "a": "Gases, petrol, kerosene, diesel oil, fuel oil, bitumen."}, {"s": "Chemistry", "t": "Fuels", "q": "Uses: petrol, kerosene, diesel oil, fuel oil, bitumen?", "a": "Cars; aircraft; cars and trains; ships and power stations; roads and roofs."}, {"s": "Chemistry", "t": "Fuels", "q": "As chain length increases: boiling point, viscosity, ease of ignition?", "a": "Boiling point ↑, viscosity ↑, harder to ignite."}, {"s": "Chemistry", "t": "Fuels", "q": "What is a homologous series?", "a": "Same general formula, differ by CH₂, similar chemical properties, gradual change in physical properties."}, {"s": "Chemistry", "t": "Fuels", "q": "General formula of alkanes? First four alkanes?", "a": "CₙH₂ₙ₊₂. Methane CH₄, ethane C₂H₆, propane C₃H₈, butane C₄H₁₀."}, {"s": "Chemistry", "t": "Fuels", "q": "Products of complete combustion?", "a": "Carbon dioxide + water."}, {"s": "Chemistry", "t": "Fuels", "q": "Products of incomplete combustion?", "a": "Carbon monoxide and soot (carbon) (+ water)."}, {"s": "Chemistry", "t": "Fuels", "q": "Why is carbon monoxide dangerous?", "a": "Toxic: binds to haemoglobin so blood can't carry oxygen. Colourless and odourless."}, {"s": "Chemistry", "t": "Fuels", "q": "Where does sulfur dioxide come from? Effect?", "a": "Sulfur impurities in fuels. Causes acid rain."}, {"s": "Chemistry", "t": "Fuels", "q": "Where do nitrogen oxides come from?", "a": "Nitrogen and oxygen from air reacting at high temperatures in engines. Acid rain."}, {"s": "Chemistry", "t": "Fuels", "q": "Advantages and disadvantages of hydrogen as a fuel?", "a": "Only product is water; but hard to store (gas), explosive, often made using fossil fuel energy."}, {"s": "Chemistry", "t": "Fuels", "q": "What is cracking and why is it needed?", "a": "Breaking large alkanes into smaller, more useful molecules (incl. alkenes) to match supply with demand."}, {"s": "Chemistry", "t": "Fuels", "q": "Conditions for cracking?", "a": "Heat the vapour and pass over a hot catalyst."}, {"s": "Chemistry", "t": "Fuels", "q": "Complete: C₁₀H₂₂ → C₈H₁₈ + ?", "a": "C₂H₄ (ethene)"}, {"s": "Chemistry", "t": "Atmosphere", "q": "What was the early atmosphere like?", "a": "Mostly CO₂ (from volcanoes), water vapour, little or no oxygen."}, {"s": "Chemistry", "t": "Atmosphere", "q": "How did the oceans form?", "a": "Earth cooled; water vapour condensed."}, {"s": "Chemistry", "t": "Atmosphere", "q": "How did CO₂ decrease?", "a": "Dissolved in oceans, locked in sedimentary rocks and fossil fuels, used in photosynthesis."}, {"s": "Chemistry", "t": "Atmosphere", "q": "How did oxygen increase?", "a": "Photosynthesis by algae and plants."}, {"s": "Chemistry", "t": "Atmosphere", "q": "Test for oxygen?", "a": "Glowing splint relights."}, {"s": "Chemistry", "t": "Atmosphere", "q": "Composition of air today?", "a": "About 78% nitrogen, 21% oxygen, 1% argon, 0.04% CO₂."}, {"s": "Chemistry", "t": "Atmosphere", "q": "Three greenhouse gases?", "a": "Carbon dioxide, methane, water vapour."}, {"s": "Chemistry", "t": "Atmosphere", "q": "Explain the greenhouse effect.", "a": "Short-wavelength radiation passes through; Earth emits infrared; greenhouse gases absorb and re-emit it, warming Earth."}, {"s": "Chemistry", "t": "Atmosphere", "q": "Human activities that add greenhouse gases?", "a": "Burning fossil fuels, deforestation (CO₂); cattle, rice, landfill (methane)."}, {"s": "Chemistry", "t": "Atmosphere", "q": "Why is historical climate data less reliable?", "a": "Fewer measurements, fewer places, and old values estimated (e.g. ice cores)."}, {"s": "Chemistry", "t": "Atmosphere", "q": "Effects of climate change?", "a": "Rising sea levels and flooding, extreme weather, rainfall changes, food problems, habitat changes."}, {"s": "Chemistry", "t": "Triple only", "q": "Flame test colours: lithium, sodium, potassium, calcium, copper?", "a": "Red, yellow, lilac, orange-red, blue-green."}, {"s": "Chemistry", "t": "Triple only", "q": "NaOH test: copper(II), iron(II), iron(III)?", "a": "Blue, green, brown precipitates."}, {"s": "Chemistry", "t": "Triple only", "q": "Test for sulfate ions?", "a": "Dilute HCl, then barium chloride → white precipitate."}, {"s": "Chemistry", "t": "Triple only", "q": "Test for halide ions?", "a": "Dilute nitric acid, then silver nitrate → chloride white, bromide cream, iodide yellow."}, {"s": "Chemistry", "t": "Triple only", "q": "Test for carbonate ions?", "a": "Add acid → fizzes; gas turns limewater milky."}, {"s": "Chemistry", "t": "Triple only", "q": "Test for alkenes?", "a": "Bromine water: orange → colourless."}, {"s": "Chemistry", "t": "Triple only", "q": "Functional groups of alcohols and carboxylic acids?", "a": "Alcohol: –OH. Carboxylic acid: –COOH."}, {"s": "Chemistry", "t": "Triple only", "q": "How is ethanol made by fermentation?", "a": "Sugar + yeast, about 30 °C, no oxygen."}, {"s": "Chemistry", "t": "Triple only", "q": "How does addition polymerisation work?", "a": "Alkene monomers' double bonds open and join into a long chain, e.g. poly(ethene)."}, {"s": "Chemistry", "t": "Triple only", "q": "Size of nanoparticles and why they're useful?", "a": "1–100 nm; huge surface area to volume ratio (good catalysts, sun creams)."}, {"s": "Maths", "t": "Number", "q": "(−4) × (−3) = ?", "a": "12 (same signs → positive)"}, {"s": "Maths", "t": "Number", "q": "What does BIDMAS stand for?", "a": "Brackets, Indices, Division/Multiplication, Addition/Subtraction."}, {"s": "Maths", "t": "Number", "q": "3 + 4 × 2² = ?", "a": "3 + 4 × 4 = 3 + 16 = 19"}, {"s": "Maths", "t": "Number", "q": "0.3 × 0.04 = ?", "a": "3 × 4 = 12, 3 decimal places → 0.012"}, {"s": "Maths", "t": "Number", "q": "What is a prime number? Is 1 prime?", "a": "Exactly two factors (1 and itself). 1 is NOT prime."}, {"s": "Maths", "t": "Number", "q": "Write 360 as a product of prime factors.", "a": "2³ × 3² × 5"}, {"s": "Maths", "t": "Number", "q": "How do you find HCF and LCM with a Venn diagram?", "a": "Put shared primes in the middle. HCF = product of middle. LCM = product of everything."}, {"s": "Maths", "t": "Number", "q": "HCF and LCM of 60 and 72?", "a": "HCF = 12, LCM = 360"}, {"s": "Maths", "t": "Number", "q": "2/3 + 1/4 = ?", "a": "8/12 + 3/12 = 11/12"}, {"s": "Maths", "t": "Number", "q": "How do you divide fractions?", "a": "KFC: Keep, Flip, Change ÷ to ×. e.g. 2/3 ÷ 4/5 = 2/3 × 5/4 = 5/6"}, {"s": "Maths", "t": "Number", "q": "Multiplier for a 15% increase? For a 15% decrease?", "a": "Increase: 1.15. Decrease: 0.85."}, {"s": "Maths", "t": "Number", "q": "Formula for percentage change?", "a": "(change ÷ original) × 100"}, {"s": "Maths", "t": "Number", "q": "After a 15% discount a coat costs £68. Original price?", "a": "68 = 85%. 1% = 0.8. 100% = £80."}, {"s": "Maths", "t": "Number", "q": "£200 at 10% compound interest for 2 years?", "a": "200 × 1.1 × 1.1 = £242"}, {"s": "Maths", "t": "Number", "q": "aᵐ × aⁿ = ?  aᵐ ÷ aⁿ = ?  (aᵐ)ⁿ = ?", "a": "aᵐ⁺ⁿ, aᵐ⁻ⁿ, aᵐⁿ"}, {"s": "Maths", "t": "Number", "q": "a⁰ = ?   a⁻ⁿ = ?", "a": "a⁰ = 1.  a⁻ⁿ = 1/aⁿ"}, {"s": "Maths", "t": "Number", "q": "What does a fractional power mean? 8^(2/3) = ?", "a": "Denominator = root, numerator = power. ∛8 = 2, 2² = 4."}, {"s": "Maths", "t": "Number", "q": "(27/8)^(−2/3) = ?", "a": "Flip: (8/27)^(2/3) → cube root: 2/3 → square: 4/9"}, {"s": "Maths", "t": "Number", "q": "Rules for standard form A × 10ⁿ?", "a": "1 ≤ A < 10, n is an integer. e.g. 45 000 = 4.5 × 10⁴; 0.0036 = 3.6 × 10⁻³"}, {"s": "Maths", "t": "Number", "q": "Simplify √72", "a": "√(36 × 2) = 6√2"}, {"s": "Maths", "t": "Number", "q": "Rationalise 6/√3", "a": "× √3/√3 → 6√3/3 = 2√3"}, {"s": "Maths", "t": "Number", "q": "Rationalise 1/(2 + √3)", "a": "× (2 − √3)/(2 − √3) → (2 − √3)/(4 − 3) = 2 − √3"}, {"s": "Maths", "t": "Number", "q": "Convert 0.272727… to a fraction.", "a": "x = 0.2727…, 100x = 27.27…, 99x = 27, x = 27/99 = 3/11"}, {"s": "Maths", "t": "Number", "q": "How do you estimate a calculation?", "a": "Round every number to 1 significant figure, then calculate."}, {"s": "Maths", "t": "Number", "q": "Error interval for 7.4 cm to 1 d.p.?", "a": "7.35 ≤ length < 7.45"}, {"s": "Maths", "t": "Algebra", "q": "Expression vs equation vs identity?", "a": "Expression: no = sign. Equation: has = and can be solved. Identity (≡): true for all values."}, {"s": "Maths", "t": "Algebra", "q": "Expand (x + 3)(x − 5)", "a": "x² − 2x − 15"}, {"s": "Maths", "t": "Algebra", "q": "Expand (x + 4)²", "a": "x² + 8x + 16 (NOT x² + 16!)"}, {"s": "Maths", "t": "Algebra", "q": "Factorise x² + 7x + 12", "a": "(x + 3)(x + 4): numbers multiply to 12, add to 7"}, {"s": "Maths", "t": "Algebra", "q": "What is the difference of two squares?", "a": "a² − b² = (a + b)(a − b). e.g. x² − 49 = (x + 7)(x − 7)"}, {"s": "Maths", "t": "Algebra", "q": "Factorise 2x² + 7x + 3", "a": "(2x + 1)(x + 3)"}, {"s": "Maths", "t": "Algebra", "q": "Solve 7x + 3 = 3x + 19", "a": "4x = 16, x = 4"}, {"s": "Maths", "t": "Algebra", "q": "Make x the subject: y = (3x − 2)/5", "a": "x = (5y + 2)/3"}, {"s": "Maths", "t": "Algebra", "q": "When do you flip an inequality sign?", "a": "When you multiply or divide both sides by a negative number."}, {"s": "Maths", "t": "Algebra", "q": "Solve 5 − 2x ≤ 11", "a": "−2x ≤ 6 → x ≥ −3"}, {"s": "Maths", "t": "Algebra", "q": "nth term of 5, 8, 11, 14…?", "a": "3n + 2"}, {"s": "Maths", "t": "Algebra", "q": "How do you find the nth term of a quadratic sequence?", "a": "Halve the 2nd difference → an². Subtract an² from the sequence → find linear nth term → add."}, {"s": "Maths", "t": "Algebra", "q": "In y = mx + c, what are m and c?", "a": "m = gradient, c = y-intercept."}, {"s": "Maths", "t": "Algebra", "q": "Gradient formula?", "a": "(change in y) ÷ (change in x) = (y₂ − y₁)/(x₂ − x₁)"}, {"s": "Maths", "t": "Algebra", "q": "Gradient of a line perpendicular to gradient 2?", "a": "−1/2 (negative reciprocal: flip and change the sign)"}, {"s": "Maths", "t": "Algebra", "q": "What is true about parallel lines' gradients?", "a": "They are the same."}, {"s": "Maths", "t": "Algebra", "q": "Solve x² + x − 12 = 0", "a": "(x + 4)(x − 3) = 0 → x = −4 or x = 3"}, {"s": "Maths", "t": "Algebra", "q": "The quadratic formula?", "a": "x = (−b ± √(b² − 4ac)) / 2a"}, {"s": "Maths", "t": "Algebra", "q": "Complete the square: x² + 6x + 2", "a": "(x + 3)² − 7. Turning point (−3, −7)."}, {"s": "Maths", "t": "Algebra", "q": "What are the roots of a quadratic graph?", "a": "Where it crosses the x-axis (y = 0)."}, {"s": "Maths", "t": "Algebra", "q": "Circle x² + y² = 25: centre and radius?", "a": "Centre (0, 0), radius 5."}, {"s": "Maths", "t": "Algebra", "q": "y = f(x + a) moves the graph how?", "a": "Left by a."}, {"s": "Maths", "t": "Algebra", "q": "Elimination: when do you add and when do you subtract?", "a": "Same signs → subtract. Different signs → add."}, {"s": "Maths", "t": "Algebra", "q": "Solve 3x + 2y = 16 and x + 2y = 8", "a": "Subtract: 2x = 8, x = 4, y = 2"}, {"s": "Maths", "t": "Algebra", "q": "For fg(x), which function do you do first?", "a": "g first, then f (right to left)."}, {"s": "Maths", "t": "Algebra", "q": "Inverse of f(x) = 3x − 1?", "a": "f⁻¹(x) = (x + 1)/3"}, {"s": "Maths", "t": "Algebra", "q": "How do you write an even and an odd number in proofs?", "a": "Even: 2n. Odd: 2n + 1."}, {"s": "Maths", "t": "Ratio", "q": "Share £60 in the ratio 3 : 2", "a": "5 parts, 1 part = £12 → £36 and £24"}, {"s": "Maths", "t": "Ratio", "q": "y ∝ x² and y = 36 when x = 3. Find y when x = 5.", "a": "y = kx², k = 4, y = 4 × 25 = 100"}, {"s": "Maths", "t": "Ratio", "q": "Direct vs inverse proportion equations?", "a": "Direct: y = kx. Inverse: y = k/x."}, {"s": "Maths", "t": "Ratio", "q": "Speed, density, pressure formulas?", "a": "Speed = distance ÷ time. Density = mass ÷ volume. Pressure = force ÷ area."}, {"s": "Maths", "t": "Ratio", "q": "2 hours 30 min as a decimal of hours?", "a": "2.5 hours (NOT 2.3)"}, {"s": "Maths", "t": "Ratio", "q": "1 m² = ? cm².  1 m³ = ? cm³", "a": "10 000 cm² and 1 000 000 cm³"}, {"s": "Maths", "t": "Ratio", "q": "On a velocity–time graph, what are the gradient and the area?", "a": "Gradient = acceleration. Area under graph = distance."}, {"s": "Maths", "t": "Geometry", "q": "Angles on a straight line / around a point / in a triangle / in a quadrilateral?", "a": "180° / 360° / 180° / 360°"}, {"s": "Maths", "t": "Geometry", "q": "Alternate, corresponding, co-interior angles?", "a": "Alternate (Z) equal. Corresponding (F) equal. Co-interior (C) add to 180°."}, {"s": "Maths", "t": "Geometry", "q": "Sum of interior angles of an n-sided polygon?", "a": "(n − 2) × 180°"}, {"s": "Maths", "t": "Geometry", "q": "Exterior angles of any polygon add to?", "a": "360°. Regular polygon: exterior = 360 ÷ n."}, {"s": "Maths", "t": "Geometry", "q": "Area of a trapezium?", "a": "½(a + b)h"}, {"s": "Maths", "t": "Geometry", "q": "Circumference and area of a circle?", "a": "C = πd = 2πr. A = πr²."}, {"s": "Maths", "t": "Geometry", "q": "Area of a sector with angle θ?", "a": "(θ/360) × πr²"}, {"s": "Maths", "t": "Geometry", "q": "Volume of a prism? Cylinder? Cone? Sphere?", "a": "Prism: cross-section × length. Cylinder: πr²h. Cone: ⅓πr²h. Sphere: (4/3)πr³."}, {"s": "Maths", "t": "Geometry", "q": "Pythagoras' theorem?", "a": "a² + b² = c² (c = hypotenuse). Longest side: add. Shorter side: subtract."}, {"s": "Maths", "t": "Geometry", "q": "Common Pythagorean triples?", "a": "3, 4, 5 / 5, 12, 13 / 8, 15, 17"}, {"s": "Maths", "t": "Geometry", "q": "SOH CAH TOA?", "a": "sin = O/H, cos = A/H, tan = O/A"}, {"s": "Maths", "t": "Geometry", "q": "sin 30°, cos 30°, tan 30°?", "a": "1/2, √3/2, √3/3"}, {"s": "Maths", "t": "Geometry", "q": "sin 45°, cos 45°, tan 45°?", "a": "√2/2, √2/2, 1"}, {"s": "Maths", "t": "Geometry", "q": "sin 60°, cos 60°, tan 60°?", "a": "√3/2, 1/2, √3"}, {"s": "Maths", "t": "Geometry", "q": "Sine rule and cosine rule?", "a": "a/sin A = b/sin B.   a² = b² + c² − 2bc cos A"}, {"s": "Maths", "t": "Geometry", "q": "Area of any triangle using trig?", "a": "½ab sin C"}, {"s": "Maths", "t": "Geometry", "q": "Angle at centre vs angle at circumference?", "a": "Angle at centre = 2 × angle at circumference."}, {"s": "Maths", "t": "Geometry", "q": "Angle in a semicircle?", "a": "90°"}, {"s": "Maths", "t": "Geometry", "q": "Opposite angles in a cyclic quadrilateral?", "a": "Add up to 180°."}, {"s": "Maths", "t": "Geometry", "q": "Angle between tangent and radius?", "a": "90°"}, {"s": "Maths", "t": "Geometry", "q": "What is the alternate segment theorem?", "a": "Angle between a tangent and a chord = angle in the alternate segment."}, {"s": "Maths", "t": "Geometry", "q": "What do you need to describe a rotation fully?", "a": "Angle, direction (clockwise/anticlockwise), centre."}, {"s": "Maths", "t": "Geometry", "q": "What do you need to describe an enlargement fully?", "a": "Scale factor and centre of enlargement."}, {"s": "Maths", "t": "Geometry", "q": "Four conditions for congruent triangles?", "a": "SSS, SAS, ASA (AAS), RHS"}, {"s": "Maths", "t": "Geometry", "q": "Length scale factor k. Area and volume scale factors?", "a": "Area: k². Volume: k³."}, {"s": "Maths", "t": "Geometry", "q": "OA = a and OB = b. What is AB?", "a": "b − a"}, {"s": "Maths", "t": "Geometry", "q": "Three rules for bearings?", "a": "From North, clockwise, 3 figures."}, {"s": "Maths", "t": "Probability", "q": "P(not A) = ?", "a": "1 − P(A)"}, {"s": "Maths", "t": "Probability", "q": "How do you work out expected frequency?", "a": "Probability × number of trials."}, {"s": "Maths", "t": "Probability", "q": "AND / OR rules?", "a": "AND → multiply. OR → add."}, {"s": "Maths", "t": "Probability", "q": "4 red, 3 blue. Pick 2 without replacement. P(both red)?", "a": "4/7 × 3/6 = 12/42 = 2/7"}, {"s": "Maths", "t": "Probability", "q": "Meaning of A ∩ B, A ∪ B, A′?", "a": "∩ = A and B (overlap). ∪ = A or B (or both). A′ = not A."}, {"s": "Maths", "t": "Probability", "q": "How do you find P(A given B) from a Venn diagram?", "a": "(number in A ∩ B) ÷ (number in B)"}, {"s": "Maths", "t": "Statistics", "q": "Mean, median, mode, range?", "a": "Mean: total ÷ count. Median: middle (in order). Mode: most common. Range: biggest − smallest."}, {"s": "Maths", "t": "Statistics", "q": "Mean from a frequency table?", "a": "Σ(x × f) ÷ Σf. For grouped data use midpoints (an estimate)."}, {"s": "Maths", "t": "Statistics", "q": "How do you compare two data sets?", "a": "Compare an average AND a spread (range/IQR), in context."}, {"s": "Maths", "t": "Statistics", "q": "Interpolation vs extrapolation?", "a": "Interpolation: inside data range (reliable). Extrapolation: outside (unreliable)."}, {"s": "Maths", "t": "Statistics", "q": "Does correlation mean one thing causes the other?", "a": "No. Correlation does not prove causation."}, {"s": "Maths", "t": "Statistics", "q": "How do you find median, LQ, UQ from cumulative frequency?", "a": "Read across at n/2, n/4 and 3n/4."}, {"s": "Maths", "t": "Statistics", "q": "Interquartile range?", "a": "UQ − LQ (spread of the middle 50%)"}, {"s": "Maths", "t": "Statistics", "q": "Five values on a box plot?", "a": "Minimum, LQ, median, UQ, maximum."}, {"s": "Maths", "t": "Statistics", "q": "Frequency density formula?", "a": "Frequency ÷ class width. Bar area = frequency."}, {"s": "Maths", "t": "Statistics", "q": "Capture–recapture: mark 20, then catch 30 with 5 marked. Population?", "a": "(20 × 30) ÷ 5 = 120"}];
let deck=[],i=0,known=0,again=[];
const $=id=>document.getElementById(id);
function topics(){const s=$('subj').value;const t=[...new Set(CARDS.filter(c=>s==='all'||c.s===s).map(c=>c.t))];
 $('topic').innerHTML='<option value="all">All topics</option>'+t.map(x=>`<option>${x}</option>`).join('');}
function build(shuffle){const s=$('subj').value,t=$('topic').value;
 deck=CARDS.filter(c=>(s==='all'||c.s===s)&&(t==='all'||c.t===t));
 if(shuffle)for(let k=deck.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[deck[k],deck[j]]=[deck[j],deck[k]];}
 i=0;known=0;again=[];render();}
function esc(x){return x.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
 $('stats').textContent=deck.length?`Card ${Math.min(i+1,deck.length)} of ${deck.length} · Got it: ${known} · To practise again: ${again.length}`:'';
 if(i>=deck.length){$('area').innerHTML=`<div class="done"><h2>Round finished!</h2><p>You knew ${known} of ${deck.length}.</p>${again.length?'<button class="primary" id="redo">Practise the '+again.length+' I missed</button>':'<p>Perfect round. 🎉</p>'}</div>`;
  if(again.length)$('redo').onclick=()=>{deck=again;i=0;known=0;again=[];render();};return;}
 const c=deck[i],col=c.s==='Chemistry'?'var(--chem)':'var(--maths)';
 $('area').innerHTML=`<div class="card" id="card"><div class="inner">
  <div class="face"><span class="tag" style="background:${col}">${c.s} · ${c.t}</span><div class="txt">${esc(c.q)}</div><span class="hint">Tap to see the answer</span></div>
  <div class="face back"><span class="tag" style="background:${col}">Answer</span><div class="txt">${esc(c.a)}</div></div></div></div>
  <div class="rate"><button class="no" id="no">✗ Need practice</button><button class="yes" id="yes">✓ Got it</button></div>
  <div class="nav"><button id="prev">← Back</button><span class="stats">Keys: space = flip, ← →</span><button id="skip">Skip →</button></div>`;
 $('card').onclick=()=>$('card').classList.toggle('flipped');
 $('yes').onclick=()=>{known++;i++;render();};
 $('no').onclick=()=>{again.push(c);i++;render();};
 $('prev').onclick=()=>{if(i>0){i--;render();}};
 $('skip').onclick=()=>{i++;render();};}
document.addEventListener('keydown',e=>{const c=$('card');if(!c)return;
 if(e.key===' '){e.preventDefault();c.classList.toggle('flipped');}
 if(e.key==='ArrowRight'){i++;render();} if(e.key==='ArrowLeft'&&i>0){i--;render();}});
$('subj').onchange=()=>{topics();build(false);};$('topic').onchange=()=>build(false);
$('shuffle').onclick=()=>build(true);$('reset').onclick=()=>build(false);
topics();build(false);
</script>
